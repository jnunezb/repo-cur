services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repo-cur-backend
    environment:
      # Este valor es obligatorio; la longitud mínima (32) se valida al iniciar la app.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-admin123}
    ports:
      - "8000:8000"
